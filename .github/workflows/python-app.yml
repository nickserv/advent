name: Python application

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - run: npx cspell .
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
          cache: pip
      - run: pip install -r requirements.txt
      - run: black --check .
      - run: isort --check .
      - run: pylint .
      - run: pyright
      - run: python -m unittest
